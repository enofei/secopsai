name: SecOpsAI Detection Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost mlflow \
                      adversarial-robustness-toolbox \
                      fastapi uvicorn python-jose passlib \
                      bcrypt python-multipart slowapi \
                      requests python-dotenv prometheus-client \
                      pytest httpx

      - name: Generate synthetic dataset
        run: python data/generate_dataset.py

      - name: Run ingestion pipeline
        run: python pipeline/ingest.py

      - name: Run feature engineering
        run: python pipeline/features.py

      - name: Run rule-based baseline
        run: python models/baseline_rules.py

      - name: Train ML classifier
        run: python models/ml_classifier.py

      - name: Run API tests
        run: pytest tests/ -v --tb=short

      - name: Verify F1 score requirement
        run: |
          python3 << 'EOF'
          import json
          with open("models/results/ml_results.json") as f:
              results = json.load(f)
          f1 = results["f1_score"]
          improvement = results.get("improvement_pct", 0)
          print(f"ML F1 Score: {f1}")
          print(f"Improvement over baseline: {improvement}%")
          assert f1 >= 0.85, f"F1 score {f1} below minimum 0.85"
          assert improvement >= 15, f"Improvement {improvement}% below 15% requirement"
          print("All regression checks passed")
          EOF

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{
              "text": "❌ SecOpsAI CI/CD Pipeline FAILED on commit ${{ github.sha }} by ${{ github.actor }}. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'

      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ SecOpsAI CI/CD Pipeline PASSED on commit ${{ github.sha }} by ${{ github.actor }}. All detection regression tests passed."
            }'
